app = "academy-game-platform"
primary_region = "dfw"
console_command = "/rails/bin/rails console"

# Rails 8 + Puma in 512MB is workable but tight; swap absorbs the spikes
# instead of OOM-killing the machine.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

# Secrets are NOT set here — this file is committed. Use `fly secrets set` for
# RAILS_MASTER_KEY, DATABASE_URL, and REDIS_URL.
[env]
  GOOD_JOB_EXECUTION_MODE = "async"
  GOOD_JOB_ENABLE_CRON = "true"
  # Thruster defaults to port 80, but the Dockerfile runs as USER 1000 and
  # non-root can't bind privileged ports — it dies with EACCES. Must match
  # http_service.internal_port below.
  HTTP_PORT = "8080"

# Runs once per deploy. A failed migration aborts the deploy instead of
# crash-looping the machine, which is much easier to read in `fly logs`.
#
# `db:migrate`, not `db:prepare`: on an empty database `db:prepare` also runs
# `db:seed`, and `db/seeds.rb` uses FactoryBot — a dev/test gem absent from the
# production image.
[deploy]
  release_command = "bin/rails db:migrate"

[http_service]
  # Must match HTTP_PORT above.
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Stop the machine when idle. This is what keeps the bill near zero, and it
  # also lets a scale-to-zero database (Neon) actually sleep — GoodJob's async
  # poller would otherwise hold it awake and burn the free compute-hour quota.
  auto_stop_machines = "stop"
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
